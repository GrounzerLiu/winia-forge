name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test and package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows
            format: zip
          - os: macos-latest
            target: macos
            format: app
          - os: ubuntu-latest
            target: linux
            format: tar.gz

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      - name: Build CLI
        run: cargo build --release -p winia-cli

      - name: Package fixture
        shell: bash
        run: |
          set -euo pipefail
          case "${{ runner.os }}" in
            Windows) WINIA="$GITHUB_WORKSPACE/target/release/winia.exe" ;;
            *)       WINIA="$GITHUB_WORKSPACE/target/release/winia" ;;
          esac
          cd .github/fixtures/ci-app
          "$WINIA" package --target "${{ matrix.target }}" --format "${{ matrix.format }}" --out-dir dist --clean

      - name: Verify checksums
        if: runner.os != 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          cd .github/fixtures/ci-app/dist
          test -s SHA256SUMS
          sha256sum -c SHA256SUMS

      - name: Verify Windows zip
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          cd .github/fixtures/ci-app
          python - <<'PY'
          import glob
          import zipfile

          archive = glob.glob("dist/ci-smoke-*-windows-*.zip")[0]
          with zipfile.ZipFile(archive) as bundle:
              names = bundle.namelist()
          assert any(name.endswith(".exe") for name in names), names
          assert any(name.endswith("assets.manifest.json") for name in names), names
          assert any(name.endswith("assets/winia/window-icon.png") for name in names), names
          PY

      - name: Install NSIS
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install nsis -y --no-progress

      - name: Package Windows installer
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          WINIA="$GITHUB_WORKSPACE/target/release/winia.exe"
          cd .github/fixtures/ci-app
          "$WINIA" package --target windows --format nsis --out-dir dist --clean
          SETUP=$(ls dist/ci-smoke-*-windows-*-setup.exe)
          test -s "$SETUP"
          grep -a -q "requireAdministrator" "$SETUP"

      - name: Install WiX
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install wixtoolset -y --no-progress

      - name: Install MSI package
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $winia = Join-Path $env:GITHUB_WORKSPACE 'target\release\winia.exe'
          Set-Location .github/fixtures/ci-app
          & $winia package --target windows --format msi --out-dir dist --clean
          if ($LASTEXITCODE -ne 0) { throw "winia package failed with exit code $LASTEXITCODE" }
          $msi = (Get-ChildItem dist -Filter *.msi | Select-Object -First 1).FullName
          if (-not $msi) { throw 'no MSI produced' }
          $target = Join-Path $env:RUNNER_TEMP 'ci-msi'
          $install = Start-Process msiexec.exe -ArgumentList '/i', $msi, '/qn', '/norestart', "INSTALLFOLDER=$target" -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "msiexec install failed with exit code $($install.ExitCode)" }
          if (-not (Test-Path (Join-Path $target 'ci-smoke.exe'))) { throw 'ci-smoke.exe missing after install' }
          if (-not (Test-Path (Join-Path $target 'assets.manifest.json'))) { throw 'assets.manifest.json missing after install' }
          if (-not (Test-Path (Join-Path $target 'assets\winia\window-icon.png'))) { throw 'assets directory missing after install' }
          $uninstall = Start-Process msiexec.exe -ArgumentList '/x', $msi, '/qn', '/norestart' -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) { throw "msiexec uninstall failed with exit code $($uninstall.ExitCode)" }

      - name: Verify macOS app bundle
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          cd .github/fixtures/ci-app
          APP=$(ls -d dist/ci-smoke-*-macos-*.app)
          test -x "$APP/Contents/MacOS/ci-smoke"
          test -f "$APP/Contents/Resources/assets.manifest.json"
          test -f "$APP/Contents/Resources/assets/winia/window-icon.png"
          test -f "$APP/Contents/Info.plist"

      - name: Sign macOS bundle
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          export WINIA_MACOS_IDENTITY="-"
          WINIA="$GITHUB_WORKSPACE/target/release/winia"
          cd .github/fixtures/ci-app
          "$WINIA" sign --target macos
          APP=$(ls -d dist/ci-smoke-*-macos-*.app)
          codesign --verify --deep --strict "$APP"
          codesign -dv "$APP" 2>&1 | grep -q "Signature=adhoc"

      - name: Package macOS disk image
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          WINIA="$GITHUB_WORKSPACE/target/release/winia"
          cd .github/fixtures/ci-app
          "$WINIA" package --target macos --format dmg --out-dir dist
          DMG=$(ls dist/ci-smoke-*-macos-*.dmg)
          test -s "$DMG"
          hdiutil imageinfo "$DMG" | grep -q "Format: UDZO"

      - name: Verify Linux tar.gz
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          cd .github/fixtures/ci-app
          TARBALL=$(ls dist/ci-smoke-*-linux-*.tar.gz)
          tar -tzf "$TARBALL" | grep -E "/ci-smoke$"
          tar -tzf "$TARBALL" | grep -E "assets\.manifest\.json"

      - name: Install Debian package
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          WINIA="$GITHUB_WORKSPACE/target/release/winia"
          cd .github/fixtures/ci-app
          "$WINIA" package --target linux --format deb --out-dir dist --clean
          DEB=$(ls dist/ci-smoke-*-linux-*.deb)
          dpkg-deb -I "$DEB"
          dpkg-deb -c "$DEB" > listing.txt
          cat listing.txt
          grep -q "usr/bin/ci-smoke" listing.txt
          grep -q "usr/lib/ci-smoke/ci-smoke" listing.txt
          grep -q "usr/share/applications/ci-smoke.desktop" listing.txt
          grep -q "usr/share/icons/hicolor" listing.txt
          sudo dpkg -i "$DEB"
          ci-smoke
          test -f /usr/share/applications/ci-smoke.desktop
          grep -q "^Icon=" /usr/share/applications/ci-smoke.desktop
          sudo dpkg -r com.example.ci-smoke
