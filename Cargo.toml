[workspace]
resolver = "2"
members = [
    "crates/winia-cli",
    "crates/winia-build",
    "crates/winia-pack",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
authors = ["Winia contributors"]

[workspace.dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
clap_complete = "4.5"
notify = "8"
ctrlc = "3"
tungstenite = "0.30"
png = "0.18"
zip = { version = "7", default-features = false, features = ["deflate"] }
tar = "0.4"
flate2 = "1"
globset = "0.4"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
