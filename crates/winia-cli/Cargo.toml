[package]
name = "winia-cli"
# Pinned rather than inherited: winia-cli changes far more often than winia-pack, and a shared
# workspace version would force a republish of the unchanged crate on every release.
version = "0.1.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Winia Forge — create, build, run, and package Winia applications"
repository.workspace = true

[[bin]]
name = "winia"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
clap_complete.workspace = true
notify.workspace = true
ctrlc.workspace = true
tungstenite.workspace = true
png.workspace = true
zip.workspace = true
tar.workspace = true
flate2.workspace = true
globset.workspace = true
semver.workspace = true
sha2.workspace = true
image.workspace = true
resvg.workspace = true
ico.workspace = true
icns.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
toml_edit.workspace = true
winia-pack = { path = "../winia-pack", version = "0.1.0" }
